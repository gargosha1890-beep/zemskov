<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Страница не найдена — Артём Земсков</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Oswald';font-weight:400 600;font-display:swap;src:url(/fonts/oswald-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Oswald';font-weight:400 600;font-display:swap;src:url(/fonts/oswald-latin.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:'Manrope';font-weight:300 700;font-display:swap;src:url(/fonts/manrope-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-weight:300 700;font-display:swap;src:url(/fonts/manrope-latin.woff2) format('woff2');unicode-range:U+0000-00FF}
:root{--bg:#000;--fg:#fff;--muted:#b9b9be;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:400 1rem/1.6 "Manrope",system-ui,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{display:grid;gap:18px;justify-items:start;max-width:560px;padding-block:48px}
b{font:500 clamp(5rem,22vw,9rem)/.85 "Oswald","Arial Narrow",sans-serif;letter-spacing:-.01em}
h1{margin:0;font:500 clamp(1.6rem,6vw,2.4rem)/1 "Oswald","Arial Narrow",sans-serif;text-transform:uppercase}
p{margin:0;color:var(--muted)}
a{display:inline-block;margin-top:8px;padding:13px 24px;border-radius:999px;background:#fff;color:#000;text-decoration:none;font:500 .72rem/1 "Manrope",sans-serif;letter-spacing:.18em;text-transform:uppercase}
a:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <b>404</b>
  <h1>Такой страницы нет</h1>
  <p>Возможно, адрес набран с ошибкой. Песни, ролики и контакты Артёма Земскова на главной странице.</p>
  <a href="/">На главную</a>
</main>
</body>
</html>
